version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: telegram-income-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      # Монтируем файл данных для сохранения между перезапусками
      - ./incomes.json:/app/incomes.json
    env_file:
      - .env
